# Evita que el proyecto gratuito de Supabase se pause por inactividad
# haciendo una consulta minima a la API REST dos veces por semana.
name: Supabase keep-alive

on:
  schedule:
    # Lunes y jueves a las 12:00 UTC (09:00 en Argentina)
    - cron: "0 12 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Faltan los secrets SUPABASE_URL y/o SUPABASE_ANON_KEY"
            exit 1
          fi

          # Con RLS la anon key recibe [] pero la consulta llega igual a Postgres.
          status=$(curl -sS -o /dev/null -w "%{http_code}" \
            --retry 3 --retry-delay 10 \
            "$SUPABASE_URL/rest/v1/providers?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")

          echo "Respuesta de Supabase: HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::Supabase respondio HTTP $status"
            exit 1
          fi
