# Evita que el proyecto gratuito de Supabase se pause por inactividad
# escribiendo un latido en la base todos los dias (supabase/keep_alive.sql).
# Un SELECT anonimo que RLS deja vacio no alcanzo: el proyecto se pauso igual.
name: Supabase keep-alive

on:
  schedule:
    # Todos los dias a las 12:00 UTC (09:00 en Argentina)
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Faltan los secrets SUPABASE_URL y/o SUPABASE_ANON_KEY"
            exit 1
          fi

          # public.keep_alive() actualiza la fila de public.keep_alive y
          # devuelve la hora del latido.
          status=$(curl -sS -o response.txt -w "%{http_code}" \
            --retry 3 --retry-delay 10 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/keep_alive" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')

          echo "Respuesta de Supabase: HTTP $status $(cat response.txt)"
          if [ "$status" != "200" ]; then
            echo "::error::Supabase respondio HTTP $status"
            exit 1
          fi
